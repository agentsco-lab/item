[package]
name = "item-compositor"
version = "0.2.0"
edition = "2021"
description = "A Wayland compositor for the Surface Duo, drawing through hwcomposer: the base of item-shell"

[dependencies]
# The mirror's frames, compressed (mirror.rs).
lz4_flex = { version = "0.11", default-features = false, features = ["safe-encode"] }
hybris-hwc = { path = "../crates/hybris-hwc" }
smithay-hybris = { path = "../crates/smithay-hybris" }
# CV ID (face.rs): YuNet and SFace.
cvid = { path = "../crates/cvid" }
# The fold camera's shots (foldcam.rs).
jpeg-encoder = "0.7"
smithay = { version = "0.7", default-features = false, features = ["renderer_gl", "wayland_frontend", "desktop", "use_system_lib", "backend_libinput"] }
# libwayland-server is opened at run time, not linked: the cross build has none.
wayland-sys = { version = "0.31", features = ["dlopen"] }
fontdue = "0.9"
libc = "0.2"
resvg = "0.45"
zbus = "5"
# phoc's device-state protocol, for phosh-osk-stevia (protocols.rs).
wayland-server = "0.31"
wayland-backend = "0.3"
wayland-scanner = "0.31"
bitflags = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# The keyring's secret exchange (keyring.rs): gcr's sx-aes-1 - DH in the 1536
# bit IKE group, HKDF-SHA256, AES-128-CBC.
num-bigint = "0.4"
hkdf = "0.12"
sha2 = "0.10"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
base64 = "0.22"
# The wallpapers (walls.rs): JPEG, decoded on a thread.
zune-jpeg = "0.4"
zune-core = "0.4"
# The system screen's weather (sysscreen.rs): met.no's JSON.
serde_json = "1"
# polkit's agent (polkit.rs): its replies wait on the dialog.
async-channel = "2"
