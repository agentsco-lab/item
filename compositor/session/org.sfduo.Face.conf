<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- item-face (CV ID): owned by root; any user may ask it, each for their
     own face only (it asks the bus who calls). -->
<busconfig>
  <policy user="root">
    <allow own="org.sfduo.Face"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.sfduo.Face" send_interface="org.sfduo.Face"/>
    <allow send_destination="org.sfduo.Face" send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.sfduo.Face" send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
</busconfig>
